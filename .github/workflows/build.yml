name: Build Shoot Studio Desktop Installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--bundles nsis,msi'
            artifact_label: windows-x64
          - platform: macos-latest
            args: '--target aarch64-apple-darwin --bundles dmg,app'
            artifact_label: macos-arm64
          - platform: macos-latest
            args: '--target x86_64-apple-darwin --bundles dmg,app'
            artifact_label: macos-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Generate native Tauri app icons (.icns / .ico)
        run: npm run tauri -- icon public/shoot-studio-logo.png

      - name: Build Tauri production bundles (.exe / .msi / .dmg)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && 'v__VERSION__' || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && 'Shoot Studio v__VERSION__' || '' }}
          releaseBody: 'Automated production release installers for Windows (.exe/.msi) and macOS (.dmg).'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shoot-studio-${{ matrix.artifact_label }}
          path: |
            src-tauri/target/**/bundle/nsis/*.exe
            src-tauri/target/**/bundle/msi/*.msi
            src-tauri/target/**/bundle/dmg/*.dmg
