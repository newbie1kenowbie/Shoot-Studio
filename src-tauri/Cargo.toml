[package]
name = "shoot-studio"
version = "0.1.0"
description = "Cross-platform desktop photo culling, editing, watermarking, and batch export studio"
authors = ["Shoot Studio"]
edition = "2021"

[lib]
name = "shoot_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
walkdir = "2.5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true
